<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DesignSpark · 本地作品库</title><link rel="stylesheet" href="/style.css"></head>
<body>
<aside class="sidebar"><a class="brand" href="/" aria-label="DesignSpark 首页"><span class="mark">✳</span>DesignSpark<span class="version">LOCAL</span></a><p class="side-caption">让收藏，成为下一次灵感。</p><button id="all" class="all active">▦ <span>全部作品</span><b id="side-count">0</b></button><div class="side-label">作品库目录 <span>LIBRARY</span></div><nav id="tree" aria-label="作品分类"></nav><footer><span class="dot"></span>本地作品库 · 只读预览<small>图片与资料均保存在你的电脑</small></footer></aside>
<main><header class="topbar"><div><span class="dot"></span> YOUR PERSONAL DESIGN ARCHIVE</div><button id="refresh" class="quiet">↻ 刷新作品库</button></header><section class="intro"><div class="eyebrow">COLLECT. CONNECT. CREATE.</div><div class="headline"><div><h1>把好设计，留在手边<span>。</span></h1><p>浏览你的设计收藏，找到下一次创作的起点。</p></div><div class="stat"><strong id="total">—</strong><span>件设计作品</span></div></div></section><section class="workspace"><div class="toolbar"><label class="search"><span>⌕</span><input id="search" placeholder="搜索作品、设计问题或类别…" aria-label="搜索作品"></label><select id="source" aria-label="来源"><option value="">全部来源</option></select><select id="year" aria-label="年份"><option value="">全部年份</option></select><select id="award" aria-label="奖项"><option value="">全部奖项</option></select></div><div class="resultbar"><div><h2 id="scope">全部作品</h2><span id="count"></span></div><span class="view-label">▦ 卡片视图</span></div><div id="status" role="status">正在读取本地作品…</div><div id="grid" class="grid"></div><button id="more" class="more" hidden>加载更多作品 ↓</button><div class="bottom-note">每一次回看，都可能是一个新想法的开始。</div></section></main>
<dialog id="detail"><div class="detail-head"><span id="detail-position"></span><div><button id="prev" aria-label="上一件作品">←</button><button id="next" aria-label="下一件作品">→</button><button id="close" aria-label="关闭详情">✕</button></div></div><div class="detail-content"><div class="gallery"><div class="hero-image"><img id="hero" alt=""><span id="no-image">暂无本地图片</span></div><div id="thumbs"></div></div><article><div id="detail-tags" class="tags"></div><h2 id="detail-title"></h2><div id="detail-category" class="detail-category"></div><h3>关于这个设计 <small>OFFICIAL DESCRIPTION</small></h3><p id="description"></p><details><summary>查看卡片原文 / 个人笔记</summary><pre id="body"></pre></details><details><summary>本地保存位置</summary><p id="folder" class="path"></p></details><a id="official" target="_blank" rel="noopener noreferrer">查看官网原作品 ↗</a></article></div></dialog>
<script src="/app.js"></script></body></html>
